# Maps each OpenRouter preset id (what Harbor sends as the model name) to the
# model and provider pinned behind it. Source of truth for docs/pricing.csv:
#   scripts/update_pricing.py reads this file and fetches the prices.
# Keep it in sync with the preset in the OpenRouter UI; when a preset changes,
# bump `version` here (results of different versions are not comparable).
# Optional `tag` picks one endpoint when a provider exposes several
# (e.g. "mistral/nvfp4"); without it the cheapest endpoint of the provider is used.

[presets."@preset/glm-eval"]
name = "eval-glm-v5-3-mistral"
model = "z-ai/glm-5.3"
provider = "Mistral"
version = 4

[presets."@preset/deepseek-eval"]
name = "eval-deepseek-v4-1-flash-digitalocean"
model = "deepseek/deepseek-v4.1-flash"
provider = "DigitalOcean"
version = 3

[presets."@preset/mistral-eval"]
name = "eval-v2-devstral-mistral"
model = "mistralai/devstral-2512"
provider = "Mistral"
version = 3
