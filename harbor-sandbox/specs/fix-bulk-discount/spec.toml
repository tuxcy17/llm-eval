# Task spec: source of truth for tasks/fix-bulk-discount/.
# Regenerate with: scripts/make_task.py fix-bulk-discount
# Relative paths are resolved from this directory.

name = "fix-bulk-discount"
instruction = "instruction.md"

[source]
# Git URL or local path. The generator fetches `revision` on the host
# (so private repos use the host credentials) and bakes the tree into the image.
repo = "git@github.com:tuxcy17/fake-app.git"
# Full 40-hex SHA only: branches and tags are not reproducible.
revision = "5137975c5bdd8f45c69501fe6fe24cb034e80164"
# Optional: use this subdirectory of the repo as /app.
# Optional: script run in /app at image build time, before the baseline commit.
# setup = "setup.sh"

[tests]
# Hidden tests, applied at verification time only (reset first, then applied).
patch = "tests.patch"
command = "python -m pytest -rA -p no:cacheprovider"
f2p = ["tests/test_bulk_discount.py"]
p2p = ["tests/test_cart.py", "tests/test_paginate.py", "tests/test_slug.py"]

[solution]
# Reference fix, used by the oracle agent.
patch = "fix.patch"

[environment]
base_image = "ubuntu:24.04"
# System packages (apt): git and bash are added automatically when missing.
# packages = []
# Python is managed by uv: interpreter version and packages, in a venv on PATH.
python = "3.12"
python_packages = ["pytest"]
# uv_version = "0.12.22"   # image tag of ghcr.io/astral-sh/uv (default is pinned)
cpus = 1
memory_mb = 1024
storage_mb = 2048

[limits]
build_timeout_sec = 900
agent_timeout_sec = 600
verifier_timeout_sec = 120
# Not read by Harbor: written to limits.env for scripts/run_claude.sh.
max_turns = 10
# max_budget_usd = "2.00"

[metadata]
difficulty = "easy"
category = "bugfix"
tags = ["python", "swe-bench-style"]
