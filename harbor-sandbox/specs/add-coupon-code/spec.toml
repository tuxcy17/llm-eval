# Relative paths are resolved from this directory.

name = "add-coupon-code"
instruction = "instruction.md"

[source]
repo = "https://github.com/tuxcy17/fake-app.git"
revision = "8dfba35f31b17fd0a28e394b2bdde8685bb33acf"

[tests]
patch = "tests.patch"
command = "python -m pytest -rA -p no:cacheprovider"
